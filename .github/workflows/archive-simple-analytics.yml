name: Archive Simple Analytics

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Save current 30-day figures
        env:
          SA_HOSTNAME: art-of-paulcasso.netlify.app
        run: node scripts/archive-simple-analytics.mjs
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add simple-analytics-archive.json
          if git diff --cached --quiet; then
            echo "No archive changes"
          else
            git commit -m "Archive Simple Analytics figures for $(date -u +%Y-%m)."
            git push
          fi
